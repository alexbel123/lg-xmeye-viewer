name: Feature request / Предложение
description: Suggest an improvement or a compatibility target.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Use case / Задача
      description: What should the user be able to do? Do not include private device details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior / Предлагаемое поведение
    validations:
      required: true
